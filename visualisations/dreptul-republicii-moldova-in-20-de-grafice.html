      table(el, [L('Tipul', 'Type'), L('Obiectul', 'Subject'), L('Hotărâri', 'Judgments')], ['civ', 'con', 'pen'].flatMap(ty => [...Object.keys(SB[ty]), 'other', 'none'].map(k => [LA(TYC[ty]), LA(SB[ty][k] || SBX[k]), c[ty].c[k] || 0])));
    }
  };
});

part('p4', 'IV. Consiliul Concurenței', 'IV. The Competition Council',
  'Deciziile Plenului Consiliului Concurenței (decision/competition-council/), din 2011 până în 2026, cu text pentru majoritatea; celelalte au doar metadate, fiindcă numesc persoane fizice. Depozitul nu are decizii din anii 2019–2024.',
  'The decisions of the Plenum of the Competition Council (decision/competition-council/), from 2011 to 2026, most with their text; the rest have metadata only, because they name individuals. The repository has no decisions from 2019–2024.');

// 17. the Council's decisions by field and year
const DOM = { aid: ['ajutor de stat', 'state aid'], merger: ['concentrări economice', 'mergers'], cartel: ['acorduri anticoncurențiale', 'anticompetitive agreements'],
  dominance: ['abuz de poziție dominantă', 'abuse of dominance'], authority: ['acțiuni ale autorităților publice', 'acts of public authorities'], unfair: ['concurență neloială', 'unfair competition'] };
const DK = Object.keys(DOM), domCol = () => [css('--s3'), css('--s1'), css('--s8'), css('--s7'), css('--s4'), css('--s5')];
chart('c17', el => {
  const c = D.c17, R = c.rows, n = R.length, cnt = k => R.filter(r => r.dom === k).length;
  return {
    title: L(`Consiliul Concurenței: ajutorul de stat, ${pct(cnt('aid'), n)} din decizii; concentrările economice, ${pct(cnt('merger'), n)}`,
      `The Competition Council: state aid is ${pct(cnt('aid'), n)} of its decisions, mergers ${pct(cnt('merger'), n)}`),
    dek: L(`Deciziile Plenului din depozit pe ani, după domeniu: ajutor de stat (Legea nr. 139/2012), concentrări economice, acorduri anticoncurențiale, abuz de poziție dominantă, acțiuni ale autorităților publice și concurență neloială. Domeniul este citit din dispozitivul deciziei (articolul de lege încălcat sau autorizarea dată); pentru deciziile fără text, din codul din numărul lor. Anii 2019–2024 lipsesc din depozit.`,
      `The Plenum’s decisions in the repository by year and field: state aid (Law No. 139/2012), mergers, anticompetitive agreements, abuse of dominance, acts of public authorities and unfair competition. The field is read from the operative part (the article of law breached or the clearance given); for decisions without text, from the code in their number. 2019–2024 are missing from the repository.`),
    draw(el) {
      const cols = domCol(), Y = d3.range(2011, 2027).map(String);
      legend(el, DK.map((k, i) => ({ c: cols[i], l: `${LA(DOM[k])} (${fmt(cnt(k))})` })).concat([{ c: '', l: L('nu sunt în depozit', 'not in the repository'), shape: 'hatch' }]));
      const rows = Y.map(y => { const o = { y }; DK.forEach(k => { o[k] = R.filter(r => r.y === y && r.dom === k).length; }); return o; });
      const w = W(el), nw = narrow(w), h = 280, m = { t: 14, r: 8, b: 26, l: 34 }, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleBand().domain(Y).range([0, iw]).padding(0.22), mx = d3.max(rows, r => sum(DK, k => r[k]));
      const y = d3.scaleLinear().domain([0, mx]).nice().range([ih, 0]), pat = hatch(svg);
      yAxis(g, y, iw, 4);
      const ga = x('2019') - x.step() * x.paddingInner() / 2, gb = x('2024') + x.bandwidth() + x.step() * x.paddingInner() / 2;
      g.append('rect').attr('x', ga).attr('width', gb - ga).attr('y', 0).attr('height', ih).attr('fill', pat).attr('opacity', .6);
      halo(g, (ga + gb) / 2, ih / 2, nw ? '2019–2024' : L('2019–2024: nu sunt în depozit', '2019–2024: not in the repository'), 'middle', 'lbl mut');
      rows.forEach(r => {
        let acc = 0; const segs = DK.map((k, i) => ({ i, v: r[k] })).filter(s => s.v), bw = x.bandwidth(), x0 = x(r.y), op = r.y === '2026' ? .6 : 1;
        segs.forEach((s, j) => { const y0 = y(acc), y1 = y(acc + s.v); acc += s.v; const topSeg = j === segs.length - 1;
          g.append('path').attr('d', topSeg ? colPath(x0, y0 - (j ? 1 : 0), bw, y1) : `M${x0},${y0 - (j ? 1 : 0)}V${y1 + 1}H${x0 + bw}V${y0 - (j ? 1 : 0)}Z`).attr('fill', cols[s.i]).attr('opacity', op); });
        if (acc) g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', y(acc) - 5).attr('text-anchor', 'middle').text(fmt(acc));
        g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(nw ? `’${r.y.slice(2)}` : r.y);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x0 - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', 0).attr('height', ih).datum(r),
          d => `<b>${d.y}${d.y === '2026' ? ' (' + t('partial') + ')' : ''}</b>` + DK.map((k, i) => d[k] ? trow(cols[i], LA(DOM[k]), fmt(d[k])) : '').join('') + trow(null, t('total'), fmt(sum(DK, k => d[k]))));
      });
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      note(el, ['decision/competition-council/<an>/<cod>-<nr>/record.json', '…/text.md'], nn(n, ['decizie', 'decizii'], ['decision', 'decisions']) + L(`, ${fmt(R.filter(r => r.text).length)} cu text`, `, ${R.filter(r => r.text).length} with text`),
        L('2026 este un an incomplet (ultima decizie: octombrie 2026), desenat mai deschis. Codurile din numere (ASR, ASS, ASO, EMAS: ajutor de stat; CEP, DCE: concentrări; DA: acorduri; APD: poziție dominantă; AAP, APR: autorități; CN, CNP: concurență neloială) sunt deduse din deciziile cu text.',
          '2026 is a partial year (the last decision: October 2026), drawn lighter. The codes in the numbers (ASR, ASS, ASO, EMAS: state aid; CEP, DCE: mergers; DA: agreements; APD: dominance; AAP, APR: authorities; CN, CNP: unfair competition) are inferred from the decisions with text.'));
      table(el, [t('year'), ...DK.map(k => LA(DOM[k])), t('total')], rows.filter(r => sum(DK, k => r[k])).map(r => [r.y, ...DK.map(k => r[k]), sum(DK, k => r[k])]));
    }
  };
});

// 18. what the Council decided
const OUT = { violation: ['încălcare constatată', 'breach found'], procedural: ['încălcare de procedură', 'procedural breach'], closed: ['investigație încetată', 'investigation closed'],
  commitments: ['angajamente acceptate', 'commitments accepted'], complaint: ['plângere respinsă', 'complaint rejected'], cleared: ['autorizare', 'cleared'],
  noaid: ['nu este ajutor de stat', 'not state aid'], other: ['altele', 'other'], notext: ['fără text în depozit', 'no text in the repository'] };
const OK = Object.keys(OUT), outCol = svg => [css('--s8'), css('--s5'), css('--muted-mark'), css('--s4'), css('--s7'), css('--s3'), css('--s1'), css('--text-3'), svg ? hatch(svg) : css('--surface-2')];
chart('c18', el => {
  const c = D.c17, R = c.rows, inv = R.filter(r => !['aid', 'merger'].includes(r.dom)), v = inv.filter(r => r.out === 'violation').length, cl = inv.filter(r => r.out === 'closed').length, invT = inv.filter(r => r.text).length;
  return {
    title: L(`Investigațiile Consiliului: încălcare constatată în ${fmt(v)} din ${fmt(invT)} de decizii cu text, investigație încetată în ${fmt(cl)}`,
      `The Council’s investigations: a breach found in ${v} of ${invT} decisions with text, the investigation closed in ${cl}`),
    dek: L('Ce spune dispozitivul fiecărei decizii, pe domenii: încălcare constatată, încălcare de procedură (refuzul inspecției, informații neprezentate), investigație încetată fără probe suficiente, angajamente acceptate, plângere respinsă; pentru ajutorul de stat și concentrări, autorizarea sau constatarea că măsura nu este ajutor de stat. Deciziile fără text sunt hașurate.',
      'What the operative part of each decision says, by field: breach found, procedural breach (refusing an inspection, withholding information), investigation closed without sufficient evidence, commitments accepted, complaint rejected; for state aid and mergers, clearance or a finding that the measure is not state aid. Decisions without text are hatched.'),
    draw(el) {
      const probe = el.append('svg').attr('width', 0).attr('height', 0).style('position', 'absolute'), cols = outCol(probe);
      legend(el, OK.map((k, i) => ({ c: cols[i], l: LA(OUT[k]), shape: k === 'notext' ? 'hatch' : '' })));
      const rows = DK.map(k => { const o = { k }; OK.forEach(q => { o[q] = R.filter(r => r.dom === k && r.out === q).length; }); return o; });
      const sb = splitBars(el, rows, OK, cols, OK.map(k => LA(OUT[k])), { label: r => Cap(LA(DOM[r.k])), rowH: 30 });
      sb.svg.node().prepend(probe.select('defs').node()); probe.remove();
      note(el, ['decision/competition-council/<an>/<cod>-<nr>/text.md'], nn(R.length, ['decizie', 'decizii'], ['decision', 'decisions']),
        L('dispozitivul este textul de după «decide:» (prima formulă «1. A constata…», «1. A înceta…», «1. A autoriza…»), clasificat după regulile din prep.py; o decizie care constată o încălcare și autorizează totuși concentrarea apare la «încălcare constatată».',
          'the operative part is the text after “decide:” (the first “1. A constata…”, “1. A înceta…”, “1. A autoriza…”), classified by the rules in prep.py; a decision that finds a breach yet clears the merger is counted as “breach found”.'));
      table(el, [L('Domeniul', 'Field'), ...OK.map(k => LA(OUT[k])), t('total')], rows.map(r => [Cap(LA(DOM[r.k])), ...OK.map(q => r[q]), sum(OK, q => r[q])]));
    }
  };
});

// 19. state aid: who notifies it, and in what form
const MS = { assets: ['bunuri transmise în gestiune', 'property handed over for management'], grant: ['subvenții, alocații, finanțări', 'grants, allocations, funding'], tax: ['scutiri de taxe sau dividende', 'tax or dividend exemptions'],
  loan: ['împrumuturi și garanții', 'loans and guarantees'], scheme: ['modificări ale unor scheme', 'changes to existing schemes'], other: ['alte forme', 'other forms'] };
const LV = { local: ['primărie sau consiliu local', 'town hall or local council'], central: ['autoritate centrală', 'central authority'], unknown: ['nespecificat', 'not stated'] };
chart('c19', el => {
  const c = D.c19, R = c.rows, early = R.filter(r => r.y < '2020'), late = R.filter(r => r.y >= '2020'), ea = early.filter(r => r.lvl === 'local' && r.m === 'assets');
  return {
    title: L(`Ajutorul de stat: în 2015–2018, ${fmt(ea.length)} din ${fmt(early.length)} de decizii priveau bunuri date de primării întreprinderilor locale de apă și canalizare`,
      `State aid: in 2015–2018, ${ea.length} of ${early.length} decisions concerned property handed by town halls to local water and sewerage companies`),
    dek: L(`Deciziile cu text privind ajutorul de stat, după cine a notificat măsura (o primărie sau un consiliu local ori o autoritate centrală) și forma sprijinului. În 2015–2018 domină bunurile publice date în gestiune întreprinderilor municipale care furnizează apă și canalizare; în 2025–2026, subvențiile și schemele ministerelor și agențiilor (${fmt(late.filter(r => r.lvl === 'central').length)} din ${nn(late.length, ['decizie', 'decizii'], [])}).`,
      `The decisions with text on state aid, by who notified the measure (a town hall or local council, or a central authority) and the form of support. In 2015–2018 public property handed over to municipal water and sewerage companies dominates; in 2025–2026, grants and schemes of ministries and agencies (${late.filter(r => r.lvl === 'central').length} of ${late.length} decisions).`),
    draw(el) {
      const cols = [css('--s3'), css('--s1'), css('--muted-mark')], keys = ['local', 'central', 'unknown'], names = keys.map(k => LA(LV[k]));
      legend(el, cols.map((cc, i) => ({ c: cc, l: names[i] })));
      const box = el.append('div').attr('class', 'mini'), panes = [box.append('div'), box.append('div')], mx = d3.max([early, late], set => d3.max(Object.keys(MS), m => set.filter(r => r.m === m).length));
      [[early, '2015–2018'], [late, '2025–2026']].forEach(([set, lab], pi) => {
        const p = panes[pi];
        p.append('h4').text(lab);
        p.append('p').text(nn(set.length, ['decizie', 'decizii'], ['decision', 'decisions']));
        const rows = Object.keys(MS).map(m => { const o = { m }; keys.forEach(k => { o[k] = set.filter(r => r.m === m && r.lvl === k).length; }); return o; });
        splitBars(p, rows, keys, cols, names, { label: r => Cap(LA(MS[r.m])), max: mx, rowH: 26 });
      });
      note(el, ['decision/competition-council/<an>/<cod>-<nr>/text.md'], nn(R.length, ['decizie', 'decizii'], ['decision', 'decisions']),
        L(`autorul notificării este citit din formula «măsura notificată de către …» a dispozitivului; forma sprijinului, din cuvintele lui (bunuri, subvenții, scutiri, împrumuturi). Toate cele ${fmt(ea.length)} decizii din 2015–2018 cu bunuri date de primării pomenesc apa și canalizarea.`,
          `the notifying authority is read from the operative part’s “măsura notificată de către …” (the measure notified by …); the form of support from its words (property, grants, exemptions, loans). All ${ea.length} decisions of 2015–2018 on property handed over by town halls mention water and sewerage.`));
      table(el, [L('Perioada', 'Period'), L('Forma', 'Form'), ...names, t('total')], [[early, '2015–2018'], [late, '2025–2026']].flatMap(([set, lab]) => Object.keys(MS).map(m => [lab, LA(MS[m]), ...keys.map(k => set.filter(r => r.m === m && r.lvl === k).length), set.filter(r => r.m === m).length])));
    }
  };
});

part('p5', 'V. Depozitul', 'V. The repository',
  'Toate sursele din depozit, pe aceeași axă a timpului.', 'Every source in the repository, on one time axis.');

// 20. what the repository covers over time
const LANE = { const: ['Constituția (versiuni)', 'Constitution (versions)'], csj: ['Curtea Supremă de Justiție', 'Supreme Court of Justice'], cc: ['Curtea Constituțională', 'Constitutional Court'],
  low: ['Judecătorii și curți de apel', 'District courts and courts of appeal'], comp: ['Consiliul Concurenței', 'Competition Council'], law: ['Legi (text consolidat)', 'Laws (consolidated text)'],
  bnm: ['Regulamente ale BNM', 'National Bank regulations'], treaty: ['Tratate', 'Treaties'] };
const LANESRC = { const: 'constitutia/', csj: 'caselaw/curtea-suprema-de-justitie/', cc: 'caselaw/curtea-constitutionala/', low: 'caselaw/judecatoria-*/, curtea-de-apel-*/', comp: 'decision/competition-council/', law: 'law/', bnm: 'norm/bnm/', treaty: 'treaty/' };
chart('c20', el => {
  const c = D.c20, N = c.n, total = sum(Object.values(N)), csj13 = (c.lanes.csj['2013'] || 0) + (c.lanes.csj['2014'] || 0);
  return {
    title: L(`Ce acoperă depozitul în timp: ${pct(N.csj, total)} din înregistrări sunt decizii ale CSJ din 2003–2017, cele mai multe din 2013–2014`,
      `What the repository covers over time: ${pct(N.csj, total)} of its records are Supreme Court decisions of 2003–2017, most from 2013–2014`),
    dek: L(`Fiecare rând este o sursă din depozit, cu numărul înregistrărilor ei pe ani (fiecare rând cu scara lui); în dreapta, totalul. Constituția are trei versiuni; legile, regulamentele Băncii Naționale și tratatul sunt câteva acte în text consolidat, datate după ultima lor modificare. Deciziile CSJ din 2013–2014 sunt ${fmt(csj13)} din ${fmt(total)} de înregistrări.`,
      `Each row is one source in the repository, with its number of records by year (each row on its own scale); the total on the right. The Constitution has three versions; the laws, the National Bank’s regulations and the treaty are a few acts in consolidated text, dated by their latest amendment. Supreme Court decisions of 2013–2014 are ${fmt(csj13)} of ${fmt(total)} records.`),
    draw(el) {
      const w = W(el), nw = narrow(w), K = Object.keys(LANE), Y = d3.range(2002, 2027);
      const labs = K.map(k => LA(LANE[k])), lw = nw ? 0 : Math.ceil(textW(el, labs) + 14), rw = Math.ceil(textW(el, ['6.329'], 'lbl strong') + 12);
      const laneH = nw ? 44 : 34, svg = svgIn(el, w, K.length * laneH + 22), g = svg.append('g').attr('transform', `translate(${lw},2)`);
      const iw = w - lw - rw, x = d3.scaleBand().domain(Y).range([0, iw]).padding(0.18), cols = S8();
      const lc = { const: cols[6], csj: cols[0], cc: cols[4], low: cols[3], comp: cols[2], law: cols[1], bnm: cols[5], treaty: cols[7] };
      K.forEach((k, i) => {
        const y0 = i * laneH + (nw ? 14 : 4), hh = laneH - (nw ? 18 : 10), v = c.lanes[k], mx = d3.max(Object.values(v)) || 1;
        if (i) g.append('line').attr('x1', -lw).attr('x2', iw + rw).attr('y1', i * laneH).attr('y2', i * laneH).attr('stroke', css('--grid'));
        if (nw) g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', y0 - 3).text(labs[i]);
        else g.append('text').attr('class', 'lbl strong').attr('x', -10).attr('y', y0 + hh / 2 + 4).attr('text-anchor', 'end').text(labs[i]);
        Y.forEach(yv => {
          const n = v[String(yv)] || 0; if (!n) return;
          const bh = Math.max(3, hh * Math.sqrt(n / mx));
          bindTip(g.append('path').attr('d', colPath(x(yv), y0 + hh, x.bandwidth(), y0 + hh - bh, 2)).attr('fill', lc[k]).attr('opacity', yv === 2026 && k !== 'low' ? .6 : 1).datum({ k, yv, n }),
            d => `<b>${esc(LA(LANE[d.k]))} · ${d.yv}</b>` + trow(lc[d.k], L('Înregistrări', 'Records'), fmt(d.n)));
        });
        g.append('text').attr('class', 'lbl strong').attr('x', iw + rw - 2).attr('y', y0 + hh / 2 + 4).attr('text-anchor', 'end').text(fmt(N[k]));
      });
      const ty = K.length * laneH + 16;
      Y.forEach(yv => { if (yv % (nw ? 6 : 2) === 0) g.append('text').attr('class', 'lbl mut').attr('x', x(yv) + x.bandwidth() / 2).attr('y', ty).attr('text-anchor', 'middle').text(nw ? `’${String(yv).slice(2)}` : yv); });
      note(el, ['constitutia/', 'caselaw/', 'decision/', 'law/', 'norm/', 'treaty/'], nn(total, ['înregistrare', 'înregistrări'], ['record', 'records']),
        L('înălțimea unei coloane este rădăcina pătrată a numărului ei față de cel mai mare din rând, ca anii mici să se vadă. Data este a deciziei, a versiunii sau a ultimei modificări. Cele 3 versiuni ale Constituției cuprind efectul a 16 acte de modificare din 1996–2024 (graficul 5).',
          'a column’s height is the square root of its count against the largest in its row, so that small years show. The date is that of the decision, the version or the latest amendment. The Constitution’s 3 versions carry the effect of 16 amending acts of 1996–2024 (chart 5).'));
      table(el, [L('Sursa', 'Source'), L('Calea', 'Path'), L('Primul', 'First'), L('Ultimul', 'Last'), t('total')], K.map(k => [LA(LANE[k]), LANESRC[k], c.span[k] ? c.span[k][0] : '', c.span[k] ? c.span[k][1] : '', N[k]]));
    }
  };
});

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Istoria git (toate commiturile)', 'Git history (every commit)'), 'git log origin/main', fmt(P.commits), L(`ultima înregistrare: ${dateTxt(P.last_record)}`, `latest record: ${dateTxt(P.last_record)}`), L('commiturile sunt datate în ziua deciziei sau a intrării în vigoare (In-force)', 'commits are dated on the day of the decision or of entry into force (In-force)')],
    [L('Constituția', 'The Constitution'), 'constitutia/', `${fmt(P.const_units)} · ${P.const_versions.length} ${L('versiuni', 'versions')}`, P.const_versions.map(v => v.slice(0, 4)).join(', '), L('fără textul din 1994 și fără fiecare modificare la data ei', 'no 1994 text and not every amendment on its own day')],
    [L('Curtea Supremă de Justiție', 'Supreme Court of Justice'), 'caselaw/curtea-suprema-de-justitie/', `${fmt(P.csj)} (${fmt(P.csj_text)} ${L('cu text', 'with text')})`, '2003–2017', L('parțial: Colegiul civil doar aprilie 2013 – februarie 2014', 'partial: the civil college only April 2013 – February 2014')],
    [L('Instanțe (judecătorii, curți de apel)', 'Courts (district, appeal)'), 'caselaw/judecatoria-*/, curtea-de-apel-*/', fmt(P.low), L('12–13 noiembrie 2026', '12–13 November 2026'), L('doar metadate; două zile', 'metadata only; two days')],
    [L('Consiliul Concurenței', 'Competition Council'), 'decision/competition-council/', `${fmt(P.comp)} (${fmt(P.comp_text)} ${L('cu text', 'with text')})`, '2011–2018, 2025–2026', L('lipsesc 2019–2024', '2019–2024 missing')],
    [L('Curtea Constituțională', 'Constitutional Court'), 'caselaw/curtea-constitutionala/', fmt(P.cc), '2002–2026', L('patru avize la proiecte de modificare a Constituției (2002, 2023, 2024) și o hotărâre din 2026', 'four opinions on draft amendments of the Constitution (2002, 2023, 2024) and a judgment of 2026')],
    [L('Legi, regulamente BNM, tratate', 'Laws, National Bank regulations, treaties'), 'law/, norm/bnm/, treaty/', fmt(P.laws + P.bnm + P.treaty), '2013–2024', L('câteva acte, în textul consolidat publicat', 'a few acts, in the published consolidated text')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(v)}</code>` : esc(v));
}
// a label drawn outside its chart is a layout bug: report it (the review script reads the console)
function checkLeftLabels(fig) {
  const fr = fig.node().getBoundingClientRect();
  fig.selectAll('svg text').each(function () {
    const r = this.getBoundingClientRect();
    if (r.width && (r.left < fr.left - 0.5 || r.right > fr.right + 0.5)) console.warn('label outside its chart', fig.attr('id'), this.textContent);
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  d3.select('#lede').text(L(`Douăzeci de grafice desenate numai din datele acestui depozit: Constituția din 29 iulie 1994 în cele trei versiuni pe care le are (2006, 2016 și 2024), ${nn(PF.csj, ['decizie', 'decizii'], [])} ale Curții Supreme de Justiție din anii 2003–2017, ${nn(PF.low, ['hotărâre', 'hotărâri'], [])} pronunțate de instanțe pe 12 și 13 noiembrie 2026, ${nn(PF.comp, ['decizie', 'decizii'], [])} ale Consiliului Concurenței și celelalte acte pe care le cuprinde acum.`,
    `Twenty charts drawn only from the data in this repository: the Constitution of 29 July 1994 in the three versions it holds (2006, 2016 and 2024), ${fmt(PF.csj)} decisions of the Supreme Court of Justice from 2003–2017, ${fmt(PF.low)} judgments delivered by the courts on 12 and 13 November 2026, ${fmt(PF.comp)} decisions of the Competition Council, and the other acts it now holds.`));
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tv = [PF.commits, PF.const_units, PF.csj, PF.low, PF.comp, PF.cc + PF.laws + PF.bnm + PF.treaty];
  const tl = L(['commituri în istorie', 'dispoziții ale Constituției, în 3 versiuni', 'decizii ale Curții Supreme de Justiție, 2003–2017', 'hotărâri ale instanțelor, 12–13 noiembrie 2026', 'decizii ale Consiliului Concurenței, 2011–2026', 'alte acte: Curtea Constituțională, legi, BNM, un tratat'],
    ['commits in the history', 'provisions of the Constitution, in 3 versions', 'decisions of the Supreme Court of Justice, 2003–2017', 'court judgments, 12–13 November 2026', 'decisions of the Competition Council, 2011–2026', 'other acts: Constitutional Court, laws, National Bank, a treaty']);
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html((v, i) => `<b>${fmt(v)}</b><span>${tl[i]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.ro, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dro, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.ro, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    checkLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.toc || spec.title.split(/:\s/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('md-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('md-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw again when the web fonts have loaded, so the measures are the fonts' own
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
