alse,"segs":[["=","Președintele Republicii Moldova este ales prin vot universal, egal, direct, secret și liber exprimat."]]},{"p":"(2)","gone":false,"new":false,"segs":[["=","Poate fi ales Președinte al Republicii Moldova cetățeanul cu drept de vot care are 40 de ani împliniți, a locuit sau locuiește permanent pe teritoriul Republicii Moldova nu mai puțin de 10 ani și posedă limba"],["-","de stat."],["+","romînă."]]},{"p":"(3)","gone":false,"new":false,"segs":[["=","Este declarat ales candidatul care a întrunit cel puțin jumătate din voturile alegătorilor ce au participat la alegeri."]]},{"p":"(4)","gone":false,"new":false,"segs":[["=","În cazul în care nici unul dintre candidați nu a întrunit această majoritate, se organizează al doilea tur de scrutin, între primii doi candidați stabiliți în ordinea numărului de voturi obținute în primul tur. Este declarat ales candidatul care a obținut cel mai mare număr de voturi, cu condiția că numărul acestora e mai mare decît numărul voturilor exprimate împotriva candidatului."]]},{"p":"(6)","gone":false,"new":false,"segs":[["=","Procedura de alegere a Președintelui Republicii Moldova este stabilită prin lege organică."]]}],"text":{"2006-07-14":"(1) Președintele Republicii Moldova este ales de Parlament prin vot secret.\n(2) Poate fi ales Președinte al Republicii Moldova cetățeanul cu drept de vot care are 40 de ani împliniți, a locuit sau locuiește permanent pe teritoriul Republicii Moldova nu mai puțin de 10 ani și posedă limba de stat.\n(3) Este ales candidatul care a obținut votul a trei cincimi din numărul deputaților aleși. Dacă nici un candidat nu a întrunit numărul necesar de voturi, se organizează al doilea tur de scrutin între primii doi candidați stabiliți în ordinea numărului descrescător de voturi obținute în primul tur.\n(4) Dacă și în turul al doilea nici un candidat nu va întruni numărul necesar de voturi, se organizează alegeri repetate.\n(5) Dacă și după alegerile repetate Președintele Republicii Moldova nu va fi ales, Președintele în exercițiu dizolvă Parlamentul și stabilește data alegerilor în noul Parlament.\n(6) Procedura de alegere a Președintelui Republicii Moldova este stabilită prin lege organică.","2016-03-04":"(1) Președintele Republicii Moldova este ales prin vot universal, egal, direct, secret și liber exprimat.\n(2) Poate fi ales Președinte al Republicii Moldova cetățeanul cu drept de vot care are 40 de ani împliniți, a locuit sau locuiește permanent pe teritoriul Republicii Moldova nu mai puțin de 10 ani și posedă limba de stat.\n(3) Este declarat ales candidatul care a întrunit cel puțin jumătate din voturile alegătorilor ce au participat la alegeri.\n(4) În cazul în care nici unul dintre candidați nu a întrunit această majoritate, se organizează al doilea tur de scrutin, între primii doi candidați stabiliți în ordinea numărului de voturi obținute în primul tur. Este declarat ales candidatul care a obținut cel mai mare număr de voturi, cu condiția că numărul acestora e mai mare decât numărul voturilor exprimate împotriva candidatului.\n(6) Procedura de alegere a Președintelui Republicii Moldova este stabilită prin lege organică.","2024-10-20":"(1) Președintele Republicii Moldova este ales prin vot universal, egal, direct, secret și liber exprimat.\n(2) Poate fi ales Președinte al Republicii Moldova cetățeanul cu drept de vot care are 40 de ani împliniți, a locuit sau locuiește permanent pe teritoriul Republicii Moldova nu mai puțin de 10 ani și posedă limba română.\n(3) Este declarat ales candidatul care a întrunit cel puțin jumătate din voturile alegătorilor ce au participat la alegeri.\n(4) În cazul în care nici unul dintre candidați nu a întrunit această majoritate, se organizează al doilea tur de scrutin, între primii doi candidați stabiliți în ordinea numărului de voturi obținute în primul tur. Este declarat ales candidatul care a obținut cel mai mare număr de voturi, cu condiția că numărul acestora e mai mare decât numărul voturilor exprimate împotriva candidatului.\n(6) Procedura de alegere a Președintelui Republicii Moldova este stabilită prin lege organică."}},"art-085":{"cap":{"2006-07-14":"Dizolvarea Parlamentului","2016-03-04":"Dizolvarea Parlamentului","2024-10-20":"Dizolvarea Parlamentului"},"w":{"2006-07-14":113,"2016-03-04":104,"2024-10-20":104},"d16":[{"p":"(1)","gone":false,"new":false,"segs":[["=","În cazul imposibilității formării Guvernului sau al blocării procedurii de adoptare a legilor timp de 3 luni, Președintele Republicii Moldova, după consultarea fracțiunilor parlamentare, poate să dizolve Parlamentul."]]},{"p":"(2)","gone":false,"new":false,"segs":[["=","Parlamentul poate fi dizolvat, dacă nu a acceptat votul de încredere pentru formarea Guvernului, în termen de 45 de zile de la prima solicitare și numai după respingerea a cel puțin două solicitări de investitură."]]},{"p":"(3)","gone":false,"new":false,"segs":[["=","În cursul unui an, Parlamentul poate fi dizolvat o singură dată."]]},{"p":"(4)","gone":false,"new":false,"segs":[["=","Parlamentul nu poate fi dizolvat în ultimele 6 luni ale mandatului Președintelui Republicii Moldova,"],["-","cu excepția cazului prevăzut la articolul 78 alineatul (5),"],["=","și nici în timpul stării de urgență, de asediu sau de război."]]}],"d24":[{"p":"(1)","gone":false,"new":false,"segs":[["=","În cazul imposibilității formării Guvernului sau al blocării procedurii de adoptare a legilor timp de 3 luni, Președintele Republicii Moldova, după consultarea fracțiunilor parlamentare, poate să dizolve Parlamentul."]]},{"p":"(2)","gone":false,"new":false,"segs":[["=","Parlamentul poate fi dizolvat, dacă nu a acceptat votul de încredere pentru formarea Guvernului, în termen de 45 de zile de la prima solicitare și numai după respingerea a cel puțin două solicitări de"],["-","investitură."],["+","învestitură."]]},{"p":"(3)","gone":false,"new":false,"segs":[["=","În cursul unui an, Parlamentul poate fi dizolvat o singură dată."]]},{"p":"(4)","gone":false,"new":fal function bands(el, rows, keys, colors, names, opt) {
  const w = W(el), nw = narrow(w), rowH = opt.rowH || 34;

  const m = { t: 4, r: Math.ceil(textW(el, rights) + 18), b: 22, l: Math.ceil(textW(el, labs) + 18) };
  const h = m.t + m.b + rowH * rows.length, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const iw = w - m.l - m.r, x = d3.scaleLinear().domain([0, 1]).range([0, iw]);

      if (x1 - x0 > (opt.minIn || 34)) row.append('text').attr('class', 'lbl').attr('x', (x0 + x1) / 2).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'middle')

  const tot = r => sum(keys, k => r[k] || 0);

  const m = { t: 2, r: Math.ceil(textW(el, rights, 'lbl') + 10), b: 4, l: up ? 0 : Math.ceil(textW(el, labs) + 14) };
  const svg = svgIn(el, w, m.t + m.b + rowH * rows.length), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const iw = w - m.l - m.r, x = d3.scaleLinear().domain([0, opt.max || d3.max(rows, tot) || 1]).range([0, iw]);

  const c = D.c02, a78 = c.arts['art-078'], a89 = c.arts['art-089'], a85 = c.arts['art-085'];
  const segsOf = d => d.flatMap(p => p.segs);
  const cnt = (d, k) => sum(segsOf(d).filter(s => s[0] === k), s => (s[1].match(/[\wăâîșț]+/gi) || []).length);
  const changed = d => segsOf(d).filter(s => s[0] !== '=');
  return {
    title: L('Cine alege Președintele: Parlamentul, cu trei cincimi din deputați, până la 4 martie 2016; de atunci, cetățenii prin vot universal',
      'Who elects the President: Parliament, by three fifths of the deputies, until 4 March 2016; since then, the citizens by universal vote'),
    dek: L(`Articolele 78 (alegerea Președintelui) și 89 (demiterea, devenită suspendarea din funcție) cuvânt cu cuvânt, așa cum le are depozitul înainte și după Hotărârea Curții Constituționale nr. 7 din 4 martie 2016, care a controlat Legea nr. 1115-XIV din 5 iulie 2000: tăiat este textul scos, subliniat cel pus în loc. Hotărârea a mai scos din art. 85 alin. (4) trimiterea la art. 78 alin. (5). În 2024, «limba de stat» din art. 78 alin. (2) a devenit «limba română».`,
      `Articles 78 (electing the President) and 89 (removal, which became suspension from office) word by word, as the repository has them before and after Constitutional Court judgment No. 7 of 4 March 2016, which reviewed Law No. 1115-XIV of 5 July 2000: struck-through words left the text, underlined words replaced them. The judgment also struck the reference to Art. 78(5) from Art. 85(4). In 2024, the “state language” of Art. 78(2) became “Romanian language”.`),
    draw(el) {
      legend(el, [{ c: css('--del-bg'), l: L('text scos în 2016', 'text removed in 2016'), shape: 'outline' }, { c: css('--ins-bg'), l: L('text pus în loc în 2016', 'text put in its place in 2016') }]);
      el.select('.legend i.outline').style('border-color', css('--s8')).style('background', css('--del-bg'));
      el.select('.legend span:nth-child(2) i').style('border-bottom', `2px solid ${css('--s3')}`);
      const box = el.append('div').attr('class', 'diff');
      const card = (art, head, extra) => {
        const d = box.append('div').attr('class', 'card');
        d.append('h4').text(head);
        const rem = cnt(art.d16, '-'), add = cnt(art.d16, '+');
        d.append('div').attr('class', 'meta').text(L(`2006 → 2016 · ${nn(rem, ['cuvânt scos', 'cuvinte scoase'], [])}, ${nn(add, ['cuvânt adăugat', 'cuvinte adăugate'], [])}`, `2006 → 2016 · ${nn(rem, [], ['word removed', 'words removed'])}, ${nn(add, [], ['word added', 'words added'])}`));
        // one paragraph per alineat: its number, then the words kept, struck out or put in
        art.d16.forEach(p => {
          const pp = d.append('p').attr('class', p.segs.every(s => s[0] === '=') ? 'same' : null);
          if (p.p) (p.gone ? pp.append('del') : p.new ? pp.append('ins') : pp.append('span')).text(p.p);
          p.segs.forEach(([k, s]) => { pp.append('span').text(' '); (k === '-' ? pp.append('del') : k === '+' ? pp.append('ins') : pp.append('span')).text(s); });
        });
        if (extra) d.append('div').attr('class', 'later').html(extra);
      };
      const l24 = changed(a78.d24);
      const was = l24.filter(s => s[0] === '-').map(s => s[1]).join(' '), now = l24.filter(s => s[0] === '+').map(s => s[1]).join(' ');
      card(a78, L('Art. 78 · Alegerea Președintelui', 'Art. 78 · Electing the President'),
        L(`<b>2024:</b> la alin. (2), «posedă limba ${esc(was.replace(/\.$/, ''))}» devine «posedă limba ${esc(now.replace(/\.$/, '').replace(/^romînă/, 'română'))}».`,
          `<b>2024:</b> in paragraph (2), “speaks the ${was.includes('stat') ? 'state language' : esc(was)}” becomes “speaks the Romanian language”.`));
      card(a89, L(`Art. 89 · ${a89.cap[c.v[0]]} → ${a89.cap[c.v[1]]}`, 'Art. 89 · Removal → Suspension from office'),
        L(`<b>Art. 85 alin. (4), tot în 2016:</b> ${changed(a85.d16).filter(s => s[0] === '-').map(s => `<del>${esc(s[1])}</del>`).join(' ')}`,
          `<b>Art. 85(4), also in 2016:</b> the words ${changed(a85.d16).filter(s => s[0] === '-').map(s => `<del>${esc(s[1])}</del>`).join(' ')} (“except in the case of Article 78(5)”) were struck out.`));
      note(el, ['constitutia/art-078.md', 'constitutia/art-085.md', 'constitutia/art-089.md'], L('3 articole în 3 versiuni', '3 articles in 3 versions'),
        L(`diferența este calculată cuvânt cu cuvânt de prep.py între versiunile din ${dateTxt(c.v[0])} și ${dateTxt(c.v[1])}; commitul din 2016 are ca autor «${c.hcc7_law}». Depozitul aplică hotărârea de la data adoptării ei; textul în vigoare între 2000 și 2006 nu este în depozit.`,
          `the difference is computed word by word by prep.py between the versions of ${dateTxt(c.v[0])} and ${dateTxt(c.v[1])}; the 2016 commit is credited to “${c.hcc7_law}”. The repository applies the judgment from the day it was adopted; the text in force between 2000 and 2006 is not in the repository.`));
      table(el, [L('Articolul', 'Article'), ...c.v.map(v => L('Cuvinte ', 'Words ') + v.slice(0, 4))], ['art-078', 'art-085', 'art-089'].map(k => [k.replace('art-0', 'Art. '), ...c.v.map(v => c.arts[k].w[v])]));
    }
  };
});

// 3. words that came and went
const PH = {
  moldoveneasca: ['«limba moldovenească»', '“Moldovan language”'], romana: ['«limba română»', '“Romanian language”'], de_stat: ['«limba de stat»', '“state language”'],
  ales_parlament: ['«ales de Parlament»', '“elected by Parliament”'], vot_universal: ['«vot universal»', '“universal vote”'],
  ue: ['«Uniunea Europeană»', '“European Union”'], avocat: ['«Avocatul Poporului»', '“People’s Advocate” (Ombudsman)'],
  csp: ['«Consiliul Superior al Procurorilor»', '“Superior Council of Prosecutors”'], csm: ['«Consiliul Superior al Magistraturii»', '“Superior Council of Magistracy”'],
  sint: ['«sînt», «sîntem», «sînteți»', '“sînt” (are), old spelling'], sunt: ['«sunt», «suntem», «sunteți»', '“sunt” (are), new spelling'],
  nici_o: ['«nici o», «nici un»', '“nici o”, “nici un” (no, none)'], nicio: ['«nicio», «niciun»', '“nicio”, “niciun”'],
  i_mid: ['cuvinte cu î în interior', 'words with î inside'], a_hat: ['cuvinte cu â', 'words with â'] };
const PG = { lang: ['Limba', 'Language'], pres: ['Președintele', 'The President'], eu: ['Europa', 'Europe'], inst: ['Instituții', 'Institutions'], spell: ['Scrierea', 'Spelling'] };
chart('c03', el => {
  const c = D.c03, R = Object.fromEntries(c.rows.map(r => [r.k, r.n]));
  return {
    title: L(`Cuvinte care au intrat și au ieșit: «limba moldovenească», de ${R.moldoveneasca[1]} ori până în 2024, apoi niciodată; «Uniunea Europeană», de ${R.ue[2]} ori în 2024`,
      `Words in and out: “Moldovan language” ${R.moldoveneasca[1]} times until 2024, then never; “European Union” ${R.ue[2]} times in 2024`),
    dek: L('De câte ori apare fiecare expresie în fiecare versiune a Constituției, cu toate formele ei (limba și limbii, Uniunea și Uniunii). Ediția din 2024 spune «limba română» (art. 13), aduce Uniunea Europeană în preambul și în titlul V¹, Avocatul Poporului și Consiliul Superior al Procurorilor și se scrie cu â și sunt. Culoarea unei celule este numărul ei față de cel mai mare din rând.',
      'How often each phrase occurs in each version of the Constitution, in all its forms (limba and limbii, Uniunea and Uniunii). The 2024 edition says “Romanian language” (Art. 13), brings the European Union into the preamble and Title V¹, adds the People’s Advocate and the Superior Council of Prosecutors, and is spelled with â and sunt. A cell’s colour is its count against the largest in its row.'),
    draw(el) {
      const w = W(el), nw = narrow(w), ramp = seqRamp();
      const groups = [...new Set(c.rows.map(r => r.g))];
      const labs = c.rows.map(r => LA(PH[r.k]));
      const lw = nw ? 0 : Math.ceil(textW(el, labs) + 18), cw = nw ? Math.min(78, (w - 70) / 3) : 92, ch = 24, gap = 6;
      const vx = i => lw + i * (cw + gap), dx = vx(3) + 6;
      let y = 22; const pos = [];
      groups.forEach(gk => { y += 18; c.rows.filter(r => r.g === gk).forEach(r => { if (nw) y += 14; pos.push({ r, y }); y += ch + 4; }); y += 4; });
      const svg = svgIn(el, w, y + 2), g = svg.append('g');
      c.v.forEach((v, i) => g.append('text').attr('class', 'lbl strong').attr('x', vx(i) + cw / 2).attr('y', 12).attr('text-anchor', 'middle').text(v.slice(0, 4)));
      g.append('text').attr('class', 'lbl strong').attr('x', dx).attr('y', 12).text(L('2016 → 2024', '2016 → 2024'));
      let gy = 22;
      groups.forEach(gk => {
        const first = pos.find(p => p.r.g === gk);
        g.append('text').attr('class', 'lbl mut').attr('x', 0).attr('y', first.y - (nw ? 20 : 6)).style('font-weight', 600).text(LA(PG[gk]).toUpperCase());
      });
      pos.forEach(({ r, y: yy }) => {
        const mx = Math.max(1, d3.max(r.n));
        if (nw) g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', yy - 4).text(LA(PH[r.k]));
        else g.append('text').attr('class', 'lbl strong').attr('x', lw - 12).attr('y', yy + ch / 2 + 4).attr('text-anchor', 'end').text(LA(PH[r.k]));
        r.n.forEach((v, i) => {
          const col = v ? ramp(0.18 + 0.82 * v / mx) : css('--surface-2');
          g.append('rect').attr('x', vx(i)).attr('y', yy).attr('width', cw).attr('height', ch).attr('rx', 6).attr('fill', col);
          g.append('text').attr('class', 'lbl').attr('x', vx(i) + cw / 2).attr('y', yy + ch / 2 + 4).attr('text-anchor', 'middle').style('fill', v ? inkOn(col) : css('--text-3')).style('font-weight', 500).text(fmt(v));
        });
        const dd = r.n[2] - r.n[1];
        g.append('text').attr('class', 'lbl strong').attr('x', dx).attr('y', yy + ch / 2 + 4).style('fill', dd > 0 ? css('--s3') : dd < 0 ? css('--s8') : css('--text-3')).text(dd > 0 ? '+' + fmt(dd) : dd < 0 ? fmt(dd) : '=');
        bindTip(g.append('rect').attr('class', 'hit').attr('x', 0).attr('width', w).attr('y', yy - (nw ? 14 : 0)).attr('height', ch + (nw ? 14 : 0)).datum(r),
          d => `<b>${esc(LA(PH[d.k]))}</b>` + c.v.map((v, i) => trow(null, dateTxt(v), fmt(d.n[i]))).join(''));
      });
      note(el, ['constitutia/<unitate>.md'], L('3 versiuni', '3 versions'),
        L('expresiile sunt căutate de prep.py în textul tuturor dispozițiilor fiecărei versiuni, fără să țină cont de majuscule (în afară de î și â); «limba de stat» rămâne în rubrica și în primul alineat al art. 13: «Limba de stat a Republicii Moldova este limba română».',
          'prep.py searches all provisions of each version for the phrases, ignoring case (except for î and â); “state language” remains in the caption and the first paragraph of Art. 13: “The state language of the Republic of Moldova is the Romanian language”.'));
      table(el, [L('Expresia', 'Phrase'), ...c.v.map(v => v.slice(0, 4))], c.rows.map(r => [LA(PH[r.k]), ...r.n]));
    }
  };
});

// 4. where the text was rewritten
chart('c04', el => {
  const c = D.c04, [v0, v1, v2] = Object.keys(c.total), R = c.rows, t3 = R.find(r => r.t === 'III');
  const addAll = sum(R, r => r.add), remAll = sum(R, r => r.rem);
  return {
    title: L(`Unde a fost rescrisă Constituția în 2024: titlul III, cu ${nn(t3.add, ['cuvânt nou', 'cuvinte noi'], [])} și ${nn(t3.rem, ['cuvânt scos', 'cuvinte scoase'], [])}`,
      `Where the Constitution was rewritten in 2024: Title III, with ${fmt(t3.add)} words added and ${fmt(t3.rem)} removed`),
    dek: L(`Cuvintele scoase (stânga) și adăugate (dreapta) între textul din 2016 și ediția din 2024, pe titluri, fără schimbările de scriere și de tipar. În titlul III s-au rescris articolele despre judecători, Consiliul Superior al Magistraturii și procuratură (art. 116 și 121–125¹); titlul II a primit capitolul despre Avocatul Poporului, iar titlul V¹ integrarea în Uniunea Europeană. În total, Constituția a crescut de la ${fmt(c.total[v1])} la ${fmt(c.total[v2])} de cuvinte.`,
      `Words removed (left) and added (right) between the 2016 text and the 2024 edition, by title, leaving out spelling and typesetting changes. In Title III the articles on judges, the Superior Council of Magistracy and the prosecution service were rewritten (Arts 116 and 121–125¹); Title II gained the chapter on the People’s Advocate, and Title V¹ integration into the European Union. In all, the Constitution grew from ${fmt(c.total[v1])} to ${fmt(c.total[v2])} words.`),
    draw(el) {
      const cr = css('--s8'), ca = css('--s1');
      legend(el, [{ c: cr, l: L(`cuvinte scoase (${fmt(remAll)})`, `words removed (${fmt(remAll)})`) }, { c: ca, l: L(`cuvinte adăugate (${fmt(addAll)})`, `words added (${fmt(addAll)})`) }]);
      const w = W(el), nw = narrow(w), rowH = 30;
      const labs = R.map(r => tName(r.t, nw)), rights = R.map(r => `${fmt(r['w' + v1.slice(0, 4)])} → ${fmt(r['w' + v2.slice(0, 4)])}`);
      const lw = Math.ceil(textW(el, labs) + 14), rw = nw ? 0 : Math.ceil(textW(el, rights, 'lbl') + 14);   // on a phone the word counts stay in the tooltip and the table
      const svg = svgIn(el, w, rowH * R.length + 26), g = svg.append('g').attr('transform', `translate(${lw},18)`);
      // one scale for both sides: a word removed is as long as a word added
      const iw = w - lw - rw, mr = d3.max(R, r => r.rem) || 0, ma = d3.max(R, r => r.add) || 1, k = (iw - 88) / (mr + ma), mid = 44 + mr * k;
      const xr = v => v * k, xl = v => v * k;
      g.append('text').attr('class', 'lbl mut').attr('x', mid - 4).attr('y', -6).attr('text-anchor', 'end').text(L('← scoase', '← removed'));
      g.append('text').attr('class', 'lbl mut').attr('x', mid + 4).attr('y', -6).text(L('adăugate →', 'added →'));
      if (!nw) g.append('text').attr('class', 'lbl mut').attr('x', iw + rw - 2).attr('y', -6).attr('text-anchor', 'end').text(L(`cuvinte ${v1.slice(0, 4)} → ${v2.slice(0, 4)}`, `words ${v1.slice(0, 4)} → ${v2.slice(0, 4)}`));
      g.append('line').attr('x1', mid).attr('x2', mid).attr('y1', 0).attr('y2', rowH * R.length).attr('stroke', css('--text-3'));
      R.forEach((r, i) => {
        const y0 = i * rowH + 8, bh = rowH - 16;
        g.append('text').attr('class', 'lbl strong').attr('x', -10).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'end').text(labs[i]);
        if (r.rem) { g.append('path').attr('d', barPathL(mid - xl(r.rem), y0, mid - 1, bh, 3)).attr('fill', cr); g.append('text').attr('class', 'lbl').attr('x', mid - xl(r.rem) - 5).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'end').text('−' + fmt(r.rem)); }
        if (r.add) { g.append('path').attr('d', barPath(mid + 1, y0, mid + 1 + xr(r.add), bh, 3)).attr('fill', ca); g.append('text').attr('class', 'lbl').attr('x', mid + xr(r.add) + 6).attr('y', y0 + bh / 2 + 4).text('+' + fmt(r.add)); }
        if (!r.rem && !r.add) g.append('text').attr('class', 'lbl mut').attr('x', mid + 6).attr('y', y0 + bh / 2 + 4).text(r.lang ? L('scriere și numele limbii', 'spelling and the language’s name') : L('doar scriere', 'spelling only'));
        if (!nw) g.append('text').attr('class', 'lbl').attr('x', iw + rw - 2).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'end').text(rights[i]);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', i * rowH).attr('height', rowH).datum(r),
          d => `<b>${esc(tName(d.t, false))}</b>` + trow(cr, L('Cuvinte scoase', 'Words removed'), fmt(d.rem)) + trow(ca, L('Cuvinte adăugate', 'Words added'), fmt(d.add)) +
            trow(null, L(`Cuvinte în ${v1.slice(0, 4)}`, `Words in ${v1.slice(0, 4)}`), fmt(d['w' + v1.slice(0, 4)])) + trow(null, L(`Cuvinte în ${v2.slice(0, 4)}`, `Words in ${v2.slice(0, 4)}`), fmt(d['w' + v2.slice(0, 4)])) +
            (d.units.length ? `<div class="q">${esc(sup(d.units.join(', ')))}</div>` : ''));
      });
      note(el, ['constitutia/<unitate>.md'], L(`${nn(c.total[v1], ['cuvânt', 'cuvinte'], [])} în 2016, ${fmt(c.total[v2])} în 2024`, `${fmt(c.total[v1])} words in 2016, ${fmt(c.total[v2])} in 2024`),
        L(`un cuvânt este un șir de litere sau cifre; nu se numără schimbările de scriere (â, sunt, nicio), de tipar și de nume ale limbii sau al persoanelor cu dizabilități din graficul 1. Textul din 2006 avea ${fmt(c.total[v0])} de cuvinte.`,
          `a word is a run of letters or digits; the spelling (â, sunt, nicio), typesetting, language-name and disability-wording changes of chart 1 are not counted. The 2006 text had ${fmt(c.total[v0])} words.`));
      table(el, [L('Titlul', 'Title'), L('Scoase', 'Removed'), L('Adăugate', 'Added'), v0.slice(0, 4), v1.slice(0, 4), v2.slice(0, 4)], R.map(r => [tName(r.t, false), r.rem, r.add, r['w' + v0.slice(0, 4)], r['w' + v1.slice(0, 4)], r['w' + v2.slice(0, 4)]]));
    }
  };
});

// 5. from adoption to the Monitorul Oficial
const actName = a => LANG === 'ro' ? a.name : a.kind === 'court' ? a.name.replace('HCC nr.', 'Constitutional Court judgment No.') : a.name.replace('Legea nr.', 'Law No.');
chart('c05', el => {
  const c = D.c05, A = c.acts, lo = A.reduce((a, b) => a.days <= b.days ? a : b), hi = A.reduce((a, b) => a.days >= b.days ? a : b);
  return {
    title: L(`De la adoptare la Monitorul Oficial: ${nn(A.length, ['act de modificare a Constituției', 'acte de modificare a Constituției'], [])}, publicate la o mediană de ${dec(c.median, 1)} zile`,
      `From adoption to the Monitorul Oficial: ${A.length} acts amending the Constitution, published after a median of ${dec(c.median, 1)} days`),
    dek: L(`Pentru fiecare lege de modificare a Constituției pe care o numesc sursele depozitului, și pentru cele două hotărâri ale Curții Constituționale dintre ele: zilele dintre adoptare și numărul Monitorului Oficial care le-a publicat. Cel mai repede a apărut ${actName(lo)}, în ${days(lo.days)}; cel mai târziu, ${actName(hi)}, în ${days(hi.days)}. Legea nr. 244/2024 poartă data referendumului din 20 octombrie 2024.`,
      `For each law amending the Constitution that the repository’s sources name, and the two Constitutional Court judgments among them: the days between adoption and the issue of the Monitorul Oficial that published it. The fastest was ${actName(lo)}, in ${days(lo.days)}; the slowest ${actName(hi)}, in ${days(hi.days)}. Law No. 244/2024 bears the date of the referendum of 20 October 2024.`),
    draw(el) {
      const cl = css('--s1'), cc = css('--s4');
      legend(el, [{ c: cl, l: L('lege', 'law') }, { c: cc, l: L('hotărâre a Curții Constituționale', 'Constitutional Court judgment') }, { c: css('--text-3'), l: L(`mediana: ${dec(c.median, 1)} zile`, `median: ${dec(c.median, 1)} days`), shape: 'dash' }]);
      const b = barList(el, A, { label: (a, nw) => nw ? `${actName(a)} · ${dateShort(a.enacted)}` : actName(a), value: a => a.days, color: a => a.kind === 'court' ? cc : cl,
        right: a => days(a.days), max: Math.ceil(hi.days / 5) * 5 + 2, cap: 260,
        tip: a => `<b>${esc(actName(a))}</b>` + trow(null, L('Adoptat', 'Adopted'), dateTxt(a.enacted)) + trow(null, L('Monitorul Oficial', 'Monitorul Oficial'), `${L('nr.', 'No.')} ${esc(a.mo)} · ${dateTxt(a.published)}`) + trow(null, L('Zile', 'Days'), fmt(a.days)) });
      const yMax = +b.svg.attr('height');
      b.g.append('line').attr('x1', b.x(c.median)).attr('x2', b.x(c.median)).attr('y1', 0).attr('y2', yMax - 6).attr('stroke', css('--text-3')).attr('stroke-dasharray', '3 3').style('pointer-events', 'none');
      b.g.selectAll('text').raise().style('paint-order', 'stroke').style('stroke', css('--surface')).style('stroke-width', 4).style('stroke-linejoin', 'round');   // the line passes behind the labels
      b.g.selectAll('rect.hit').raise();
      note(el, ['data/laws.csv (enacted, published)', 'git log -1 ' + A.find(a => a.src.startsWith('git')).src.match(/\(([0-9a-f]+)\)/)[1]], nn(A.length, ['act', 'acte'], ['act', 'acts']),
        L('legile din 1996–2006 și HCC nr. 7/2016 sunt în data/laws.csv; actele din 2016–2024 sunt cele pe care ediția Moldpres din 2024 le enumeră în mesajul commitului ei, cu data și numărul Monitorului. HCC nr. 7/2016 a intrat în vigoare la adoptare, înainte de publicare. Cele două rectificări din 1994 nu sunt acte de modificare și nu apar.',
          'the laws of 1996–2006 and judgment No. 7/2016 are in data/laws.csv; the acts of 2016–2024 are those the 2024 Moldpres edition lists, as given in its commit message with the date and issue of the Monitorul. Judgment No. 7/2016 took effect on adoption, before publication. The two corrections of 1994 are not amending acts and are left out.'));
      table(el, [L('Actul', 'Act'), L('Adoptat', 'Adopted'), L('Publicat', 'Published'), L('Monitorul Oficial nr.', 'Monitorul Oficial No.'), L('Zile', 'Days')], A.map(a => [actName(a), a.enacted, a.published, a.mo, a.days]));
    }
  };
});

part('p2', 'II. Curtea Supremă de Justiție', 'II. The Supreme Court of Justice',
  'Deciziile din baza de date jurisprudenta.csj.md, așa cum le are depozitul (caselaw/curtea-suprema-de-justitie/): pentru fiecare, numărul dosarului, data, colegiul și numărul de pagini; pentru o parte dintre ele și textul. Deciziile despre persoane fizice au numai metadate. Acoperirea este inegală: Colegiul civil apare doar din aprilie 2013 până în februarie 2014.',
  'The decisions of the jurisprudenta.csj.md database as the repository holds them (caselaw/curtea-suprema-de-justitie/): for each one the case number, the date, the bench and the number of pages; for some of them the text as well. Decisions about individuals have metadata only. Coverage is uneven: the civil college appears only from April 2013 to February 2014.');

// 6. what the repository holds, by database and year
chart('c06', el => {
  const c = D.c06, civ = c.dbs.find(d => d.db === 'col_civil'), pen = c.dbs.find(d => d.db === 'plen_penal');
  return {
    title: L(`${nn(c.n, ['decizie a Curții Supreme de Justiție', 'decizii ale Curții Supreme de Justiție'], [])}: ${pct(civ.n, c.n)} sunt ale Colegiului civil, ${pct(civ.y['2013'], civ.n)} dintre acestea din 2013`,
      `${fmt(c.n)} decisions of the Supreme Court of Justice: ${pct(civ.n, c.n)} from the civil college, ${pct(civ.y['2013'], civ.n)} of those from 2013`),
    dek: L(`Fiecare rând este o bază de date a Curții, fiecare coloană un an; numărul din celulă arată câte decizii din acel an are depozitul. Colegiul civil (${fmt(civ.n)}) și Plenul Colegiului penal (${fmt(pen.n)}, singurul cu decizii în fiecare an din 2013 până în 2017) dau ${pct(civ.n + pen.n, c.n)} din total. Bara din dreapta este totalul fiecărei baze.`,
      `Each row is one of the Court’s databases and each column a year; the number in a cell is how many decisions of that year the repository holds. The civil college (${fmt(civ.n)}) and the plenum of the criminal college (${fmt(pen.n)}, the only one with decisions in every year from 2013 to 2017) make up ${pct(civ.n + pen.n, c.n)} of the total. The bar on the right is each database’s total.`),
    draw(el) {
      const w = W(el), nw = narrow(w), Y = c.years.filter(y => c.dbs.some(d => d.y[y])), rows = [...c.dbs].sort((a, b) => b.n - a.n);
      const labs = rows.map(r => dbName(r.db, nw)), lw = Math.ceil(textW(el, labs) + 12), tw = nw ? 44 : 110;
      const cw = Math.max(14, (w - lw - tw - 8) / Y.length), ch = nw ? 22 : 26, gap = 2;
      const mx = d3.max(rows, r => d3.max(Object.values(r.y))), col = v => seqRamp()(0.12 + 0.88 * Math.log1p(v) / Math.log1p(mx));
      const svg = svgIn(el, w, 20 + rows.length * (ch + gap)), g = svg.append('g').attr('transform', `translate(${lw},18)`);
      Y.forEach((y, j) => g.append('text').attr('class', 'lbl mut').attr('x', j * cw + cw / 2).attr('y', -6).attr('text-anchor', 'middle').text(nw ? `’${String(y).slice(2)}` : y));
      const xt = d3.scaleLinear().domain([0, d3.max(rows, r => r.n)]).range([0, tw - (nw ? 0 : 42)]), x0 = Y.length * cw + 8;
      rows.forEach((r, i) => {
        const yy = i * (ch + gap);
        g.append('text').attr('class', 'lbl strong').attr('x', -10).attr('y', yy + ch / 2 + 4).attr('text-anchor', 'end').text(labs[i]);
        Y.forEach((y, j) => {
          const v = r.y[y] || 0;
          g.append('rect').attr('x', j * cw + 1).attr('y', yy).attr('width', cw - 2).attr('height', ch).attr('rx', 5).attr('fill', v ? col(v) : css('--surface-2'));
          if (v && textW(el, [fmt(v)], 'lbl') + 6 < cw) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', yy + ch / 2 + 4).attr('text-anchor', 'middle').style('fill', inkOn(col(v))).style('pointer-events', 'none').text(fmt(v));
        });
        if (!nw) {
          g.append('path').attr('d', barPath(x0, yy + ch / 2 - 5, x0 + Math.max(2, xt(r.n)), 10, 3)).attr('fill', css('--s1'));
          g.append('text').attr('class', 'lbl').attr('x', x0 + Math.max(2, xt(r.n)) + 5).attr('y', yy + ch / 2 + 4).text(fmt(r.n));
        } else g.append('text').attr('class', 'lbl strong').attr('x', x0).attr('y', yy + ch / 2 + 4).text(fmt(r.n));
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', yy).attr('height', ch).datum(r),
          d => `<b>${esc(dbName(d.db, false))}</b>` + Y.filter(y => d.y[y]).map(y => trow(null, y, fmt(d.y[y]))).join('') + trow(null, t('total'), fmt(d.n)) +
            trow(null, L('Prima / ultima', 'First / last'), `${dateShort(d.first)} – ${dateShort(d.last)}`));
      });
      note(el, ['caselaw/curtea-suprema-de-justitie/<an>/<bază>-<id>/record.json'], nn(c.n, ['decizie', 'decizii'], ['decision', 'decisions']) + L(` (${fmt(c.records)} de înregistrări)`, ` (${fmt(c.records)} records)`),
        L(`${fmt(c.repeats)} înregistrări repetă un PDF deja numărat (același source_sha256) și nu sunt numărate a doua oară. Anii fără decizii în depozit nu au coloană. Colegiul civil are id-urile 1–${fmt(civ.ids[1])} ale bazei de date, din care depozitul are ${fmt(civ.records)}.`,
          `${fmt(c.repeats)} records repeat a PDF already counted (same source_sha256) and are not counted twice. Years with no decisions in the repository have no column. The civil college has ids 1–${fmt(civ.ids[1])} of the database, of which the repository holds ${fmt(civ.records)}.`));
      table(el, [L('Baza de date', 'Database'), ...Y.map(String), t('total')], rows.map(r => [dbName(r.db, false), ...Y.map(y => r.y[y] || 0), r.n]));
    }
  };
});

// 7. the day of the week
chart('c07', el => {
  const c = D.c07, R = c.rows, civ = R.find(r => r.db === 'col_civil'), pen = R.find(r => r.db === 'plen_penal');
  const plenMon = R.filter(r => ['hot_expl', 'avize_csj', 'plen_csj'].includes(r.db)), pm = sum(plenMon, r => r.wd[0]), pn = sum(plenMon, r => r.n);
  return {
    title: L(`Fiecare complet are ziua lui: ${pct(civ.wd[2], civ.n)} din deciziile Colegiului civil poartă data de miercuri, ${pct(pen.wd[3], pen.n)} din ale Plenului penal, de joi`,
      `Each bench has its day: ${pct(civ.wd[2], civ.n)} of the civil college’s decisions are dated Wednesday, ${pct(pen.wd[3], pen.n)} of the criminal plenum’s Thursday`),
    dek: L(`Ziua săptămânii din data fiecărei decizii, pe baze de date. Hotărârile explicative, avizele consultative și hotărârile Plenului Curții poartă în ${pct(pm, pn)} din cazuri data de luni. În dreapta: în câte zile diferite s-au dat deciziile și cele mai multe decizii purtând aceeași dată.`,
      `The day of the week of each decision’s date, by database. The explanatory decisions, advisory opinions and decisions of the full Plenum are dated Monday in ${pct(pm, pn)} of cases. On the right: on how many different days the decisions were given, and the most decisions bearing a single date.`),
    draw(el) {
      const w = W(el), nw = narrow(w), ramp = seqRamp(), rows = [...R].sort((a, b) => b.n - a.n);
      const labs = rows.map(r => dbName(r.db, nw)), rights = rows.map(r => nw ? `${fmt(r.days)} · ${fmt(r.max)}` : L(`${nn(r.days, ['zi', 'zile'], [])} · max. ${fmt(r.max)}`, `${nn(r.days, [], ['day', 'days'])} · max ${fmt(r.max)}`));
      const lw = Math.ceil(textW(el, labs) + 12), rw = Math.ceil(textW(el, rights, 'lbl') + 14);
      const cw = Math.min(64, (w - lw - rw) / 7), ch = nw ? 22 : 26, gap = 2;
      const svg = svgIn(el, w, 22 + rows.length * (ch + gap)), g = svg.append('g').attr('transform', `translate(${lw},18)`);
      DOW2[LANG].forEach((d, j) => g.append('text').attr('class', 'lbl mut').attr('x', j * cw + cw / 2).attr('y', -6).attr('text-anchor', 'middle').text(nw ? d : Cap(DOW[LANG][j])));
      g.append('text').attr('class', 'lbl mut').attr('x', 7 * cw + 10).attr('y', -6).text(nw ? L('zile · max.', 'days · max') : L('zile cu decizii · cele mai multe într-o zi', 'days with decisions · most in one day'));
      rows.forEach((r, i) => {
        const yy = i * (ch + gap);
        g.append('text').attr('class', 'lbl strong').attr('x', -10).attr('y', yy + ch / 2 + 4).attr('text-anchor', 'end').text(labs[i]);
        r.wd.forEach((v, j) => {
          const s = v / r.n, colr = v ? ramp(0.1 + 0.9 * s) : css('--surface-2');
          g.append('rect').attr('x', j * cw + 1).attr('y', yy).attr('width', cw - 2).attr('height', ch).attr('rx', 5).attr('fill', colr);
          if (v && cw > 30) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', yy + ch / 2 + 4).attr('text-anchor', 'middle').style('fill', inkOn(colr)).style('pointer-events', 'none').text(s >= 0.995 ? pv(100) : s < 0.005 ? '<1' : dec(100 * s, 0));
        });
        g.append('text').attr('class', 'lbl').attr('x', 7 * cw + 10).attr('y', yy + ch / 2 + 4).text(rights[i]);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', yy).attr('height', ch).datum(r),
          d => `<b>${esc(dbName(d.db, false))}</b>` + d.wd.map((v, j) => v ? trow(null, Cap(DOW[LANG][j]), `${fmt(v)} · ${pct(v, d.n)}`) : '').join('') +
            trow(null, L('Zile cu decizii', 'Days with decisions'), fmt(d.days)) + trow(null, L('Cele mai multe într-o zi', 'Most in one day'), `${fmt(d.max)} (${dateShort(d.maxday)})`));
      });
      note(el, ['caselaw/curtea-suprema-de-justitie/…/record.json (decision_date)'], nn(sum(R, r => r.n), ['decizie', 'decizii'], ['decision', 'decisions']),
        L('data este cea din antetul PDF-ului oficial (decision_date); numerele din celule sunt procente din deciziile rândului. Ziua din dată nu spune când a fost publicată decizia.',
          'the date is the one in the heading of the official PDF (decision_date); the numbers in the cells are percentages of the row’s decisions. The date does not say when a decision was published.'));
      table(el, [L('Baza de date', 'Database'), ...DOW[LANG].map(Cap), L('Zile', 'Days'), L('Max. într-o zi', 'Max in a day')], rows.map(r => [dbName(r.db, false), ...r.wd, r.days, r.max]));
    }
  };
});

// 8. the civil college, day by day
chart('c08', el => {
  const c = D.c08, ds = Object.keys(c.days).sort(), tot = sum(Object.values(c.days)), wed = sum(ds.filter(d => PD(d).getDay() === 3), d => c.days[d]);
  const [mxd, mxn] = c.max, aug = c.months['2013-08'] || 0, sept = c.months['2013-09'] || 0, may = c.months['2013-05'] || 0;
  return {
    title: L(`Colegiul civil zi de zi: aproape numai miercurea, cu până la ${nn(mxn, ['decizie', 'decizii'], [])} într-o zi (${dateTxt(mxd)})`,
      `The civil college day by day: almost only on Wednesdays, with up to ${fmt(mxn)} decisions in a day (${dateTxt(mxd)})`),
    dek: L(`Fiecare pătrățel este o zi, fiecare coloană o săptămână; culoarea arată câte decizii ale Colegiului civil, comercial și de contencios administrativ poartă acea dată. ${pct(wed, tot)} dintre ele cad miercurea. În august 2013 colegiul a dat ${nn(aug, ['decizie', 'decizii'], [])}, în mai ${fmt(may)}, în septembrie ${fmt(sept)}. Între sfârșitul lui octombrie 2013 și mijlocul lui ianuarie 2014 depozitul nu are aproape nicio decizie a colegiului (hașurat): îi lipsesc id-urile ${fmt(c.holes[0].from_id)}–${fmt(c.holes[c.holes.length - 1].to_id)} ale bazei de date.`,
      `Each small square is a day and each column a week; the colour shows how many decisions of the civil, commercial and administrative college bear that date. ${pct(wed, tot)} of them fall on a Wednesday. In August 2013 the college gave ${fmt(aug)} decisions, in May ${fmt(may)} and in September ${fmt(sept)}. Between late October 2013 and mid-January 2014 the repository has almost no decisions of the college (hatched): it lacks ids ${fmt(c.holes[0].from_id)}–${fmt(c.holes[c.holes.length - 1].to_id)} of the database.`),
    draw(el) {
      const ramp = seqRamp(), BIN = [1, 10, 50, 100, 150], bcol = i => ramp(0.2 + 0.2 * i);
      const binOf = v => v >= 150 ? 4 : v >= 100 ? 3 : v >= 50 ? 2 : v >= 10 ? 1 : 0;
      const BN = [L('1–9 decizii', '1–9 decisions'), '10–49', '50–99', '100–149', L('150 sau mai multe', '150 or more')];
      legend(el, BN.map((l, i) => ({ c: bcol(i), l })).concat([{ c: css('--surface-2'), l: L('nicio decizie', 'no decision') }, { c: '', l: L('id-uri lipsă din depozit', 'ids missing from the repository'), shape: 'hatch' }]));
      const w = W(el), nw = narrow(w);
      const start = d3.timeMonday.floor(PD('2013-04-22')), end = d3.timeMonday.ceil(PD('2014-02-09'));
      const weeks = d3.timeMonday.range(start, end), gapA = PD(c.gap[0]), gapB = PD(c.gap[1]);
      const halves = nw ? [weeks.slice(0, Math.ceil(weeks.length / 2)), weeks.slice(Math.ceil(weeks.length / 2))] : [weeks];
      const lw = Math.ceil(textW(el, DOW2[LANG], 'lbl') + 8);
      const cs = Math.min(18, Math.floor((w - lw) / d3.max(halves, h => h.length)) - 2), step = cs + 2, ph = 7 * step + 22;
      const svg = svgIn(el, w, halves.length * (ph + 8)), pat = hatch(svg);
      halves.forEach((wk, hi) => {
        const g = svg.append('g').attr('transform', `translate(${lw},${hi * (ph + 8) + 18})`);
        [0, 2, 4].forEach(d => g.append('text').attr('class', 'lbl mut').attr('x', -6).attr('y', d * step + cs / 2 + 4).attr('text-anchor', 'end').text(DOW2[LANG][d]));
        let labEnd = -1e9;
        wk.forEach((mon, j) => {
          // a month's name over the first week that begins in it (with the year in January and at the start), if it has room
          const first = j === 0 || mon.getMonth() !== d3.timeDay.offset(mon, -7).getMonth();
          if (first) { const lab = MON[LANG][mon.getMonth()] + (mon.getMonth() === 0 || j === 0 ? ' ' + mon.getFullYear() : ''), tw = textW(el, [lab], 'lbl');
            if (j * step > labEnd + 6 && j * step + tw <= wk.length * step) { g.append('text').attr('class', 'lbl mut').attr('x', j * step).attr('y', -6).text(lab); labEnd = j * step + tw; } }
          for (let d = 0; d < 7; d++) {
            const day = d3.timeDay.offset(mon, d), key = d3.timeFormat('%Y-%m-%d')(day), v = c.days[key] || 0;
            const inGap = day > gapA && day < gapB;
            const r = g.append('rect').attr('x', j * step).attr('y', d * step).attr('width', cs).attr('height', cs).attr('rx', 3).attr('fill', v ? bcol(binOf(v)) : inGap ? pat : css('--surface-2'));
            if (v) bindTip(r.datum({ key, v }), q => `<b>${Cap(DOW[LANG][(PD(q.key).getDay() + 6) % 7])}, ${dateTxt(q.key)}</b>` + trow(null, L('Decizii', 'Decisions'), fmt(q.v)));
          }
        });
      });
      note(el, ['caselaw/curtea-suprema-de-justitie/<an>/col-civil-<id>/record.json'], nn(tot, ['decizie', 'decizii'], ['decision', 'decisions']) + L(` din ${fmt(ds.length)} de zile`, ` on ${fmt(ds.length)} days`),
        L(`id-urile bazei de date cresc odată cu data; golul este acolo unde lipsesc peste 100 de id-uri consecutive (ultima zi dinaintea lui: ${dateTxt(c.gap[0])}, prima de după: ${dateTxt(c.gap[1])}). Pe 27 noiembrie 2013 depozitul are totuși câteva decizii. ${nn(c.outside.length, ['decizie', 'decizii'], [])} din alți ani (${c.outside.map(o => o[0].slice(0, 4)).join(', ')}) nu sunt în calendar.`,
          `the database’s ids grow with the date; the gap is where over 100 consecutive ids are missing (the last day before it: ${dateTxt(c.gap[0])}, the first after it: ${dateTxt(c.gap[1])}). The repository does have a few decisions of 27 November 2013. ${fmt(c.outside.length)} decisions from other years (${c.outside.map(o => o[0].slice(0, 4)).join(', ')}) are not in the calendar.`));
      table(el, [L('Luna', 'Month'), L('Decizii', 'Decisions'), L('Zile cu decizii', 'Days with decisions')], Object.keys(c.months).map(m => [`${MON[LANG][+m.slice(5) - 1]} ${m.slice(0, 4)}`, c.months[m], ds.filter(d => d.startsWith(m)).length]));
    }
  };
});

// 9. what the civil college hears, from the case numbers
const FAM = { ra: ['Recursuri împotriva hotărârilor și deciziilor (ra)', 'Appeals against judgments and decisions (ra)', 'Recursuri vs. hotărâri și decizii', 'Appeals vs judgments, decisions'],
  r: ['Recursuri împotriva încheierilor (r, rc)', 'Appeals against interlocutory rulings (r, rc)', 'Recursuri vs. încheieri', 'Appeals vs rulings'],
  rh: ['Cereri de revizuire (rh, rhc)', 'Requests for revision (rh, rhc)', 'Revizuiri', 'Revisions'], ri: ['Insolvabilitate (ri)', 'Insolvency (ri)', 'Insolvabilitate', 'Insolvency'],
  other: ['Alte coduri sau fără număr', 'Other codes or no number', 'Altele', 'Other'] };
chart('c09', el => {
  const c = D.c09, n = c.n, F = ['ra', 'r', 'rh', 'ri', 'other'];
  const rows = F.map(f => { const o = { f }; ['2', '3', '-'].forEach(b => { o[b] = sum(c.rows.filter(r => r.f === f && r.br === b), r => r.n); }); o.tot = o['2'] + o['3'] + o['-']; return o; });
  const ra = rows[0], adm = sum(rows, r => r['3']), ev = c.evid.find(e => e.br === '3' && e.f === 'ra');
  return {
    title: L(`Ce judecă Colegiul civil: ${pct(ra.tot, n)} din dosare sunt recursuri împotriva hotărârilor și deciziilor`, `What the civil college hears: ${pct(ra.tot, n)} of its cases are appeals against judgments and decisions`),
    dek: L(`Numărul dosarului spune ce fel de cauză este: cifra din față arată materia (2 pentru civil și comercial, 3 pentru contencios administrativ: ${pct(ev.admin, ev.n)} din textele publicate ale dosarelor 3ra privesc un act administrativ), iar literele, procedura (ra: recurs împotriva unei hotărâri sau decizii; r: recurs împotriva unei încheieri; rh: cerere de revizuire; ri: insolvabilitate). Contenciosul administrativ are ${pct(adm, n)} din dosare.`,
      `The case number says what kind of case it is: the first digit gives the field (2 for civil and commercial, 3 for administrative litigation: ${pct(ev.admin, ev.n)} of the published texts of 3ra cases concern an administrative act), and the letters the procedure (ra: appeal against a judgment or decision; r: appeal against an interlocutory ruling; rh: request for revision; ri: insolvency). Administrative litigation is ${pct(adm, n)} of the cases.`),
    draw(el) {
      const cols = [css('--s1'), css('--s4'), css('--muted-mark')], names = [L('civil și comercial (cifra 2)', 'civil and commercial (digit 2)'), L('contencios administrativ (cifra 3)', 'administrative litigation (digit 3)'), L('fără cifră', 'no digit')];
      legend(el, cols.map((cc, i) => ({ c: cc, l: names[i] })));
      splitBars(el, rows, ['2', '3', '-'], cols, names, { label: (r, nw) => L(...(nw ? FAM[r.f].slice(2) : FAM[r.f].slice(0, 2))), right: r => `${fmt(r.tot)} · ${pct(r.tot, n)}`, rowH: 30 });
      // the share of each family's published texts that says what the letters mean (the table under the chart has every code)
      const evs = (f, k) => { const es = c.evid.filter(e => e.f === f && e.br); return pct(sum(es, e => e[k] || 0), sum(es, e => e.n)); };
      note(el, ['caselaw/curtea-suprema-de-justitie/<an>/col-civil-<id>/record.json (number)', '…/text.md'], nn(n, ['decizie', 'decizii'], ['decision', 'decisions']),
        L(`sensul literelor este verificat pe textele publicate: ${evs('r', 'incheiere')} din textele dosarelor «r» și «rc» atacă o încheiere, ${evs('ra', 'decizie')} din cele «ra» o hotărâre sau o decizie; ${evs('rh', 'revizuire')} din cele «rh» sunt revizuiri, iar ${evs('ri', 'insolv')} din cele «ri» privesc insolvabilitatea (tabelul de mai jos). «Alte coduri» sunt ds, cc, ac și numerele fără litere.`,
          `the meaning of the letters is checked against the published texts: ${evs('r', 'incheiere')} of the texts of «r» and «rc» cases challenge an interlocutory ruling and ${evs('ra', 'decizie')} of «ra» texts a judgment or decision; ${evs('rh', 'revizuire')} of «rh» texts are revisions and ${evs('ri', 'insolv')} of «ri» texts concern insolvency (table below). “Other codes” are ds, cc, ac and numbers without letters.`));
      table(el, [L('Procedura', 'Procedure'), names[0], names[1], names[2], t('total')], rows.map(r => [L(...FAM[r.f].slice(0, 2)), r['2'], r['3'], r['-'], r.tot]));
      const EV = ['decizie', 'incheiere', 'revizuire', 'insolv', 'admin'], EVN = { decizie: [L('«împotriva hotărârii/deciziei»', '“against the judgment/decision”')], incheiere: [L('«împotriva încheierii»', '“against the ruling”')], revizuire: [L('«revizuire»', '“revision”')], insolv: [L('«insolvabil»', '“insolvency”')], admin: [L('act administrativ', 'administrative act')] };
      subTable(el, L('Textele publicate: ce spun ele, pe coduri', 'The published texts: what they say, by code'), [L('Codul', 'Code'), L('Texte', 'Texts'), ...EV.map(k => EVN[k][0])],
        c.evid.filter(e => e.br && e.f !== 'other' && e.n >= 5).sort((a, b) => b.n - a.n).map(e => [`${e.br}${e.f}`, e.n, ...EV.map(k => pct(e[k] || 0, e.n))]), [0, 1, 1, 1, 1, 1, 1]);
    }
  };
});

// 10. length in pages
const PB = [['1–2 pagini', '1–2 pages'], ['3–4', '3–4'], ['5–7', '5–7'], ['8–12', '8–12'], ['13 sau mai multe', '13 or more']];
chart('c10', el => {
  const c = D.c10, rows = [...c.rows].sort((a, b) => b.med - a.med || b.n - a.n), pp = c.rows.find(r => r.db === 'plen_penal'), il = c.rows.find(r => r.db === 'interes_lege');
  return {

// 11. the outcome of each published decision

    title: L(`Deciziile cu text ale Colegiului civil: ${pct(cnt('admitted'), n)} admit recursul, ${pct(cnt('rejected'), n)} îl resping, ${pct(cnt('inadmissible'), n)} îl declară inadmisibil`,

      `Each square is one of the ${fmt(n)} decisions of the civil college whose text is in the repository: cases with no individuals, between companies, banks and public authorities. The colour comes from the operative part (“Se admite recursul…”, the appeal is allowed; “Se respinge recursul…”, dismissed; “…se consideră inadmisibil”, inadmissible). ${rev.length === revIn ? `All ${rev.length} requests for revision were declared inadmissible` : `${revIn} of ${rev.length} requests for revision were declared inadmissible`}, as were ${pct(ra2In, ra2.length)} of civil and commercial appeals; ${incMost ? 'appeals against interlocutory rulings are dismissed most often' : 'appeals against interlocutory rulings are dismissed in'} (${pv(100 * incR)}).`),

        bindTip(g.append('g').selectAll('circle').data(pts).join('circle').attr('cx', p => p.x).attr('cy', p => p.y).attr('r', p => p.rad).attr('fill', css('--text-2')).attr('fill-opacity', .55).attr('stroke', css('--surface')).attr('stroke-width', 1.2),
          p => `<b>${esc(COURT(p.r.c))}</b>` + keys.map((k, i) => p.r[k] ? trow(cols[i], names[i], fmt(p.r[k])) : '').join('') + trow(null, t('total'), fmt(p.r.n)));
        // town labels: right of the circle, else left, else above; skipped if they would overlap
        const placed = [];
        pts.slice().sort((a, b) => b.r.n - a.r.n).forEach(p => {
          const txt = `${TOWN[p.r.c][2]} ${fmt(p.r.n)}`, tw = textW(pm, [txt], 'lbl'), cand = [[p.x + p.rad + 4, p.y + 4, 'start'], [p.x - p.rad - 4, p.y + 4, 'end'], [p.x, p.y - p.rad - 5, 'middle'], [p.x, p.y + p.rad + 13, 'middle']];
          for (const [lx, ly, an] of cand) {
            const x0 = an === 'start' ? lx : an === 'end' ? lx - tw : lx - tw / 2, box_ = [x0 - 1, ly - 10, x0 + tw + 1, ly + 3];
            if (box_[0] < 0 || box_[2] > w || box_[1] < 0 || box_[3] > h) continue;
            if (placed.some(b => !(box_[2] < b[0] || box_[0] > b[2] || box_[3] < b[1] || box_[1] > b[3]))) continue;
            if (pts.some(q => q !== p && q.x + q.rad > box_[0] && q.x - q.rad < box_[2] && q.y + q.rad > box_[1] && q.y - q.rad < box_[3])) continue;
            placed.push(box_); halo(g, lx, ly, txt, an, 'lbl strong'); break;
          }
        });
      }).catch(() => msg.text(L('harta nu s-a putut încărca', 'the map could not be loaded')));
      const sorted = [...C].sort((a, b) => (a.lvl === 'apel') - (b.lvl === 'apel') || b.n - a.n);
      splitBars(pl, sorted, keys, cols, names, { label: r => COURT(r.c), above: false, rowH: 23 });
      note(el, ['caselaw/judecatoria-<oraș>/2026/<id>/record.json', 'caselaw/curtea-de-apel-<regiune>/2026/<id>/record.json'], nn(c.n, ['hotărâre', 'hotărâri'], ['judgment', 'judgments']),
        L(`${Object.entries(c.days).sort().map(([d, n]) => `${dateTxt(d)}: ${fmt(n)}`).join('; ')}. Harta: world-atlas 50m; poziția este a orașului din numele judecătoriei, nu a unui sediu anume.`,
          `${Object.entries(c.days).sort().map(([d, n]) => `${dateTxt(d)}: ${fmt(n)}`).join('; ')}. Map: world-atlas 50m; the position is that of the town in the court’s name, not of a particular courthouse.`));
      table(el, [L('Instanța', 'Court'), ...names, t('total')], sorted.map(r => [COURT(r.c), r.civ, r.con, r.pen, r.n]));
    }
  };
});

      note(el, ['caselaw/…/2026/<id>/record.json (number, decision_date)'], nn(c.n, ['hotărâre', 'hotărâri'], ['judgment', 'judgments']),
        L(`${nn(c.unparsed, ['număr are', 'numere au'], [])} altă formă și nu este numărat. Data din număr este a înregistrării la instanța respectivă: pentru un apel sau un recurs, timpul petrecut înainte, la prima instanță, nu se vede.`,
          `${fmt(c.unparsed)} number has another form and is not counted. The date in the number is that of filing at that court: for an appeal, the time spent before, at the first court, does not show.`));

});

// 16. what was decided
const SB = { civ: { debt: ['încasarea datoriei', 'debt recovery'], family: ['familie: divorț, întreținere, copii', 'family: divorce, maintenance, children'], admin: ['acte administrative', 'administrative acts'],
    contract: ['contracte, bănci, leasing', 'contracts, banks, leasing'], damage: ['prejudicii', 'damages'], insolv: ['insolvabilitate, răspundere subsidiară', 'insolvency, subsidiary liability'] },
  con: { electoral: ['coruperea electorală (art. 47¹)', 'electoral corruption (Art. 47¹)'], traffic: ['circulația rutieră', 'road traffic'], family_v: ['violența în familie', 'domestic violence'],
    order: ['samavolnicie, nesubordonare', 'arbitrariness, disobedience'], child: ['obligații față de copii', 'duties towards children'] },
  pen: { drunk: ['conducere în stare de ebrietate (art. 264¹)', 'drink-driving (Art. 264¹)'], family_v: ['violența în familie', 'domestic violence'], corrupt: ['corupere, trafic de influență', 'bribery, influence peddling'],
    property: ['furt, jaf, escrocherie', 'theft, robbery, fraud'], injury: ['vătămarea integrității corporale', 'bodily harm'] } };
const SBX = { other: ['alte obiecte', 'other subjects'], none: ['titlul nu spune obiectul', 'no subject in the title'] };
chart('c16', el => {
  const c = D.c16, cs = c.civ, withSubj = cs.n - (cs.c.none || 0);
  return {
    title: L(`Ce s-a judecat: încasarea unei datorii în ${pct(cs.c.debt, cs.n)} din cauzele civile, coruperea electorală în ${fmt(c.con.c.electoral)} din ${fmt(c.con.n)} de cauze contravenționale`,
      `What was decided: debt recovery in ${pct(cs.c.debt, cs.n)} of civil cases, electoral corruption in ${c.con.c.electoral} of ${c.con.n} contravention cases`),
    dek: L(`Obiectul fiecărei cauze, citit din titlul hotărârii (partea de după «–»), pe tipuri de cauze; printre cauzele civile al căror titlu spune obiectul, încasarea unei datorii este ${pct(cs.c.debt, withSubj)}. Coruperea electorală este contravenția de la art. 47¹ din Codul contravențional, iar conducerea în stare de ebrietate cu grad avansat, infracțiunea de la art. 264¹ din Codul penal, cum le numesc titlurile. Barele gri sunt obiectele pe care nicio regulă nu le recunoaște și titlurile fără obiect.`,
      `The subject of each case, read from the judgment’s title (the part after “–”), by type of case; among civil cases whose title states the subject, debt recovery is ${pct(cs.c.debt, withSubj)}. Electoral corruption is the contravention of Art. 47¹ of the Contravention Code, and driving with a high level of alcohol the offence of Art. 264¹ of the Criminal Code, as the titles name them. Grey bars are subjects no rule recognises and titles with no subject.`),
    draw(el) {
      const box = el.append('div').attr('class', 'multi'), cols = { civ: css('--s1'), con: css('--s4'), pen: css('--s8') };

        p.append('p').text(nn(d.n, ['hotărâre', 'hotărâri'], ['judgment', 'judgments']));

          right: r => `${fmt(r.n)} · ${pct(r.n, d.n)}`, tip: r => `<b>${esc(Cap(LA(SB[ty][r.k] || SBX[r.k])))}</b>` + trow(null, L('Hotărâri', 'Judgments'), fmt(r.n)) + trow(null, t('share'), pct(r.n, d.n)) });
